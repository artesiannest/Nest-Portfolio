<!-- Hilangkan menu Ide AI dan ikon jeda animasi -->
<style>
  #motion-toggle,
  .room-status-note,
  #view-ai,
  [data-view="ai"],
  #ai,
  a[href="#ai"] {
    display: none !important;
  }
</style>

<script>
  (() => {
    "use strict";

    // Aktifkan kembali animasi jika sebelumnya pernah dijeda.
    try {
      localStorage.setItem("nest-motion", "on");
    } catch (_) {}

    function bersihkanTampilan() {
      const tombolAnimasi = document.getElementById("motion-toggle");

      // Sinkronkan pengaturan animasi dengan script website.
      if (
        tombolAnimasi &&
        !tombolAnimasi.disabled &&
        document.documentElement.classList.contains("motion-paused")
      ) {
        tombolAnimasi.click();
      }

      // Tombol disembunyikan agar script lama tetap kompatibel.
      if (tombolAnimasi) {
        tombolAnimasi.hidden = true;
        tombolAnimasi.setAttribute("aria-hidden", "true");
        tombolAnimasi.setAttribute("tabindex", "-1");
      }

      // Hapus tautan menuju bagian Ide AI.
      document.querySelectorAll('a[href="#ai"]').forEach((tautan) => {
        tautan.remove();
      });

      // Hapus keterangan tombol jeda animasi.
      document.querySelectorAll(".room-status-note").forEach((catatan) => {
        catatan.remove();
      });

      // Sembunyikan halaman Ide AI.
      document
        .querySelectorAll('#view-ai, [data-view="ai"], #ai')
        .forEach((bagian) => {
          bagian.hidden = true;
          bagian.setAttribute("aria-hidden", "true");
        });

      arahkanKeKamar();
    }

    // Tautan lama menuju Ide AI diarahkan kembali ke kamar.
    function arahkanKeKamar() {
      if (window.location.hash.toLowerCase() === "#ai") {
        window.location.replace("#beranda");
      }
    }

    window.addEventListener("hashchange", arahkanKeKamar);

    if (document.readyState === "loading") {
      document.addEventListener(
        "DOMContentLoaded",
        bersihkanTampilan,
        { once: true }
      );
    } else {
      bersihkanTampilan();
    }
  })();
</script>
