<!-- Bubble perkenalan di bawah kursi Nestiara -->
<style>
  .room-stage .room-introduction.nest-under-chair {
    position: absolute !important;
    left: 61% !important;
    bottom: 1% !important;
    top: auto !important;
    right: auto !important;
    transform: translateX(-50%) !important;
    margin: 0 !important;
    width: max-content !important;
    max-width: 38% !important;
    height: auto !important;
    flex-basis: auto !important;
    z-index: 8 !important;
    display: block !important;
    color: var(--room-ink, #142126);
    text-decoration: none;
  }

  .room-stage .nest-under-chair .speech-bubble {
    position: static !important;
    display: block !important;
    transform: none !important;
    animation: none !important;
    min-width: 0 !important;
    margin: 0 !important;
    padding: 8px 16px !important;
    border-radius: 12px !important;
    background: var(--room-paper, #fff4df);
    border: 1px solid #e3c497;
    box-shadow: 0 4px 16px #06131f30;
    font-size: clamp(0.6rem, 1vw, 0.9rem) !important;
    line-height: 1.3 !important;
    text-align: center;
    white-space: normal;
  }

  .room-stage .nest-under-chair .speech-bubble strong {
    font-size: 1.15em !important;
  }

  .room-stage .nest-under-chair .speech-bubble::after,
  .room-stage .nest-under-chair .bubble-dots {
    display: none !important;
  }

  .room-stage .nest-under-chair:focus-visible {
    outline: 3px solid #f6c987;
    outline-offset: 4px;
    border-radius: 12px;
  }

  @media (max-width: 640px) {
    .room-stage .room-introduction.nest-under-chair {
      left: 61% !important;
      bottom: 1% !important;
      max-width: 40% !important;
    }

    .room-stage .nest-under-chair .speech-bubble {
      padding: 5px 8px !important;
      font-size: 0.6rem !important;
      border-radius: 8px !important;
    }
  }
</style>

<script>
(function () {
  'use strict';

  function moveIntroductionUnderChair() {
    const stage = document.querySelector('.room-stage');
    if (!stage) return;

    let introduction = document.querySelector(
      'a.room-introduction'
    );

    // Mendukung versi lama yang bubble-nya masih di karakter.
    if (!introduction) {
      const oldBubble = document.querySelector(
        '#character-hotspot .speech-bubble'
      );

      introduction = document.createElement('a');
      introduction.className = 'room-introduction';

      if (oldBubble) {
        introduction.appendChild(oldBubble);
      } else {
        const bubble = document.createElement('span');
        bubble.className = 'speech-bubble';

        bubble.appendChild(
          document.createTextNode('Berkenalan dengan')
        );

        bubble.appendChild(document.createElement('br'));

        const name = document.createElement('strong');
        name.textContent = 'Nestiara';
        bubble.appendChild(name);

        introduction.appendChild(bubble);
      }
    }

    introduction.href = '#tentang';
    introduction.classList.add('nest-under-chair');
    introduction.setAttribute(
      'aria-label',
      'Berkenalan dengan Nestiara, buka Tentang dan Pengalaman'
    );

    // Memindahkan elemen yang sama, bukan membuat duplikat.
    stage.appendChild(introduction);
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      moveIntroductionUnderChair,
      { once: true }
    );
  } else {
    moveIntroductionUnderChair();
  }
})();
</script>
